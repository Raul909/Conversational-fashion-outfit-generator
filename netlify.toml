# Netlify Configuration for Fashion Outfit Generator Frontend

[build]
  # Base directory where your client code is
  base = "client"
  
  # Command to build your React app
  command = "npm install && npm run build"
  
  # Directory where the built files will be
  publish = "build"

[build.environment]
  # Node version
  NODE_VERSION = "18"

# Redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CORS headers for API calls
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

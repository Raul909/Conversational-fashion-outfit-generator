# Render Configuration File
# This file configures automatic deployment of the Fashion Outfit Generator backend

services:
  # Web Service - Flask Backend
  - type: web
    name: fashion-outfit-backend
    env: python
    region: oregon  # Choose your preferred region
    plan: free  # Options: free, starter, standard
    
    # Build command - runs once during deployment
    buildCommand: |
      cd server
      pip install --upgrade pip
      pip install -r requirements.txt
      python -m spacy download en_core_web_md
      python -m spacy download en_core_web_sm
    
    # Start command - runs to start your application
    # Using python directly (simpler) - for production, use gunicorn
    startCommand: cd server && python main_app.py
    
    # Alternative with gunicorn (production-ready):
    # startCommand: cd server && gunicorn --bind 0.0.0.0:$PORT main_app:app
    
    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      
      - key: GEMINI_KEY
        sync: false  # This must be set manually in Render dashboard
      
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://cfog.netlify.app  # Include both local dev and production frontend
      
      - key: FLASK_DEBUG
        value: False
    
    # Health check endpoint
    healthCheckPath: /api/recommendations
    
    # Auto-deploy settings
    autoDeploy: true  # Automatically deploy on git push
    
    # Custom domains (optional)
    # domains:
#   buildCommand: cd server && pip install -r requirements.txt
#   startCommand: cd server && python worker.py
